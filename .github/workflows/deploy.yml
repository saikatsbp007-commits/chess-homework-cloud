
name: Chess Homework Preview Deployment

on:
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP exists
        run: |
          test -f chess-homework-cloudflare-development-v4.zip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract project
        run: |
          mkdir -p "$RUNNER_TEMP/chess-homework"
          unzip -q chess-homework-cloudflare-development-v4.zip -d "$RUNNER_TEMP/chess-homework"

      - name: Install dependencies
        working-directory: ${{ runner.temp }}/chess-homework/chess-homework-cloudflare
        run: npm install

      - name: Run automated tests
        working-directory: ${{ runner.temp }}/chess-homework/chess-homework-cloudflare
        run: |
          npm test
          npm run check

      - name: Deploy preview Worker
        working-directory: ${{ runner.temp }}/chess-homework/chess-homework-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --name chess-homework-server-v4-preview
          printf '%s' "${{ secrets.ROOM_AUTH_SECRET }}" | npx wrangler secret put ROOM_AUTH_SECRET --name chess-homework-server-v4-preview
          npx wrangler deploy --name chess-homework-server-v4-preview
